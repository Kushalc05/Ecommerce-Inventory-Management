<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders | StockFlow</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header>

        <a
            class="brand"
            href="catalog.html"
        >
            <b>S</b> StockFlow
        </a>

        <nav id="nav"></nav>

    </header>

    <main class="page">

        <div class="page-head">

            <div>

                <small>CUSTOMER STORE</small>

                <h1>Order history</h1>

                <p>
                    Products you have ordered.
                </p>

            </div>

            <button
                class="btn"
                onclick="loadOrders()"
            >
                Refresh
            </button>

        </div>

        <section class="table-card">

            <div class="scroll">

                <table>

                    <thead>

                        <tr>

                            <th>Product</th>

                            <th>Price</th>

                            <th>Quantity</th>

                        </tr>

                    </thead>

                    <tbody id="orders"></tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        StockFlow · Order History
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>

    <script>
        requireAuth('CUSTOMER');
    </script>

</body>

</html>
