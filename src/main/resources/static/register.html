<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | StockFlow</title><link rel="stylesheet" href="css/style.css"></head><body class="auth"><main><a class="brand" href="index.html"><b>S</b> StockFlow</a><section class="auth-card"><small>CREATE ACCOUNT</small><h1>Join StockFlow</h1><p>New accounts are created with customer access.</p><div id="error" class="error hidden"></div><form id="form"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="new-password"></label><button id="submit" class="btn primary full">Create account</button></form><p class="center">Already have an account? <a href="login.html">Sign in</a></p></section></main><script src="js/api.js"></script><script src="js/auth.js"></script><script>form.onsubmit=async e=>{e.preventDefault();error.classList.add('hidden');submit.disabled=true;submit.textContent='Creating…';try{await register(username.value.trim(),password.value);location.href='login.html'}catch(x){error.textContent=x.message;error.classList.remove('hidden')}finally{submit.disabled=false;submit.textContent='Create account'}}</script></body></html>
