<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | StockFlow</title><link rel="stylesheet" href="css/style.css"></head><body class="auth"><main><a class="brand" href="index.html"><b>S</b> StockFlow</a><section class="auth-card"><small>WELCOME BACK</small><h1>Sign in to StockFlow</h1><p>Access your customer or administrator workspace.</p><div id="error" class="error hidden"></div><form id="form"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button id="submit" class="btn primary full">Sign in</button></form><p class="center">Don't have an account? <a href="register.html">Create one</a></p></section></main><script src="js/api.js"></script><script src="js/auth.js"></script><script>form.onsubmit=async e=>{e.preventDefault();error.classList.add('hidden');submit.disabled=true;submit.textContent='Signing in…';try{const u=await login(username.value.trim(),password.value);location.href=u.role==='ADMIN'?'admin-dashboard.html':'catalog.html'}catch(x){error.textContent=x.message;error.classList.remove('hidden')}finally{submit.disabled=false;submit.textContent='Sign in'}}</script></body></html>
